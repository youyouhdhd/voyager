name: Research Archive 归档问题
description: 反馈 Voyager 增强版的导出问题
title: '[Export] '
body:
  - type: input
    id: version
    attributes:
      label: 扩展和 Chrome 版本
      placeholder: 2.3.3.1 (Research Archive) / Chrome 版本 / 操作系统
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤、导出格式、预期和实际结果
      description: 请使用不含私人对话或账号信息的示例。
    validations:
      required: true
